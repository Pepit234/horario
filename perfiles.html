<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escuela Cristo Rey · Perfiles</title>
<meta property="og:title" content="Escuela Cristo Rey · Perfiles">
<meta property="og:description" content="Crea tu perfil con nombre y foto y busca a tus compañeros.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pepit234.github.io/horario/perfiles.html">
<meta property="og:image" content="https://pepit234.github.io/horario/foto.jpg">
<link rel="icon" href="foto.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<style>
:root{--bg:#161a3a;--surface:#212756;--ink:#f2f4ff;--muted:#aab2e0;--line:#343c7a;--gold:#ffd43b;--accent:#9db4ff;--btn-ink:#161a3a;--bad:#ff8787;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root{--bg:#eef1ff;--surface:#fff;--ink:#1a2050;--muted:#5d66a0;--line:#d5dbf5;--gold:#e08a00;--accent:#2b3fd1;--btn-ink:#fff;--bad:#c92a2a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.35}
main{max-width:520px;margin:0 auto;padding:18px 14px 40px}
h1{font-family:Pacifico,"Brush Script MT",cursive;font-weight:400;font-size:2.3rem;line-height:1.15;margin:4px 0 0;text-align:center;
background:linear-gradient(90deg,#ffd43b,#ff922b,#ff6b6b);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.sub{text-align:center;color:var(--muted);margin:2px 0 16px}
h2{font-size:1.05rem;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:700;margin:10px 0 4px}
input[type=text],input[type=search]{width:100%;font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button,.filebtn{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;display:inline-block}
button.main{background:var(--accent);color:var(--btn-ink);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.4rem;overflow:hidden;flex:0 0 auto}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.person{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px}
.pname{font-weight:700;word-break:break-word}
.you{color:var(--muted);font-weight:400}
.op{margin-left:6px;font-size:.68rem;font-weight:800;background:var(--gold);color:#161a3a;border-radius:999px;padding:1px 8px;vertical-align:middle}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.status{font-size:.9rem;margin:10px 0 0;font-weight:700}
.none{color:var(--muted);font-size:.9rem}
#msg{min-height:1.2em;margin:8px 0 0;font-weight:700;color:var(--gold)}
#msg.err{color:var(--bad)}
.back{display:block;text-align:center;margin-top:18px;color:var(--accent);font-weight:700}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<main>
  <h1>Escuela Cristo Rey</h1>
  <p class="sub">Perfiles de compañeros</p>

  <section class="card" aria-labelledby="mi">
    <h2 id="mi">Mi perfil</h2>
    <div class="row">
      <div id="pv" class="av" aria-hidden="true">?</div>
      <div>
        <label class="filebtn" for="file" style="margin:0">Elegir foto</label>
        <input id="file" type="file" accept="image/*">
        <button id="nophoto" type="button">Quitar foto</button>
      </div>
    </div>
    <label for="name">Nombre o apodo</label>
    <input id="name" type="text" maxlength="30" autocomplete="off" placeholder="Ej: RobeLuis">
    <p class="hint">Usa un apodo y una foto que no te importe que otros vean. No pongas teléfono ni dirección.</p>
    <div class="row" style="margin-top:12px">
      <button id="save" class="main" type="button" disabled>Guardar</button>
      <button id="del" type="button" hidden>Borrar mi perfil</button>
    </div>
    <p class="status" id="status"></p>
    <p id="msg" role="status" aria-live="polite"></p>
  </section>

  <section aria-labelledby="bus">
    <h2 id="bus">Buscar perfiles</h2>
    <input id="q" type="search" placeholder="Escribe un nombre…" aria-label="Buscar por nombre" autocomplete="off">
    <p class="hint" id="count"></p>
    <div id="list" style="margin-top:10px"></div>
  </section>

  <a class="back" href="./">← Volver a mi horario</a>
</main>
<noscript><p style="padding:16px">Necesitas activar JavaScript para ver esta página.</p></noscript>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,deleteDoc,onSnapshot,collection,query,where,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyCgdSFziFWl_1wujBfZguvNeDY_KVI6BDQ",
  authDomain:"perfiles-horario.firebaseapp.com",
  projectId:"perfiles-horario",
  storageBucket:"perfiles-horario.firebasestorage.app",
  messagingSenderId:"512921423727",
  appId:"1:512921423727:web:c8d9e5eeb20d272853a29a"
});
const auth=getAuth(app), db=getFirestore(app);
const $=id=>document.getElementById(id);
const OKIMG=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
let uid=null, mine=null, all=[], photo="", filled=false;
const OPERADOR="awXs3SBHtNgeNE8dDBhFP3yLHjX2";

function msg(t,err){const m=$("msg");m.textContent=t||"";m.className=err?"err":""}
function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function avatar(name,ph,el){
  const d=el||document.createElement("div"); d.className="av"; d.textContent="";
  if(ph&&ph.length<=30000&&OKIMG.test(ph)){const i=document.createElement("img");i.alt="";i.src=ph;d.appendChild(i)}
  else d.textContent=(name||"?").trim().charAt(0).toUpperCase()||"?";
  return d;
}
function drawPreview(){avatar($("name").value,photo,$("pv"))}

function renderMine(){
  if(mine&&!filled){$("name").value=mine.name;photo=mine.photo;filled=true}
  drawPreview();
  $("del").hidden=!mine;
  const s=$("status");
  if(!mine){s.textContent=""}
  else if(mine.approved===true){s.textContent="✔ Tu perfil está aprobado y todos lo pueden ver."}
  else{s.textContent="⏳ En revisión: solo tú lo ves hasta que sea aprobado."}
}
function renderList(){
  const q=norm($("q").value.trim()), box=$("list"); box.innerHTML="";
  const items=all.filter(p=>!q||norm(p.name).includes(q)).sort((a,b)=>a.name.localeCompare(b.name,"es"));
  $("count").textContent=all.length?(items.length+" de "+all.length+" perfiles"):"";
  if(!items.length){const p=document.createElement("p");p.className="none";
    p.textContent=all.length?"No encontré a nadie con ese nombre.":"Todavía no hay perfiles aprobados.";box.appendChild(p);return}
  items.forEach(p=>{
    const c=document.createElement("div");c.className="card person";
    c.appendChild(avatar(p.name,p.photo));
    const n=document.createElement("div");n.className="pname";n.textContent=p.name;
    if(p.id===uid){const t=document.createElement("span");t.className="you";t.textContent=" (tú)";n.appendChild(t)}
    if(p.id===OPERADOR){const o=document.createElement("span");o.className="op";o.textContent="Operador";n.appendChild(o)}
    c.appendChild(n);box.appendChild(c);
  });
}

function shrink(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);
    for(const [size,q] of [[160,.7],[160,.55],[128,.6],[96,.6]]){
      const c=document.createElement("canvas");c.width=c.height=size;
      const x=c.getContext("2d"), s=Math.min(img.width,img.height);
      x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
      const d=c.toDataURL("image/jpeg",q); if(d.length<=28000){res(d);return}
    }
    rej(new Error("grande"));
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("lectura"))};
  img.src=url;
})}

$("file").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f)return;
  if(!f.type.startsWith("image/")){msg("Elige una imagen.",true);return}
  try{photo=await shrink(f);drawPreview();msg("Foto lista. Toca Guardar.")}
  catch(_){msg("No pude usar esa foto. Prueba con otra.",true)}
});
$("nophoto").addEventListener("click",()=>{photo="";drawPreview();msg("Sin foto. Toca Guardar.")});
$("name").addEventListener("input",drawPreview);
$("q").addEventListener("input",renderList);

$("save").addEventListener("click",async()=>{
  const name=$("name").value.trim().replace(/\s+/g," ");
  if(name.length<2||name.length>30){msg("El nombre debe tener entre 2 y 30 letras.",true);return}
  $("save").disabled=true;
  try{
    await setDoc(doc(db,"perfiles",uid),{name,photo:photo||"",approved:false});
    msg("Guardado. Queda en revisión hasta que lo aprueben.");
  }catch(_){msg("No se pudo guardar. Revisa tu internet e intenta otra vez.",true)}
  $("save").disabled=false;
});
$("del").addEventListener("click",async()=>{
  if(!confirm("¿Borrar tu perfil?"))return;
  try{await deleteDoc(doc(db,"perfiles",uid));filled=false;photo="";$("name").value="";msg("Perfil borrado.")}
  catch(_){msg("No se pudo borrar.",true)}
});

function start(){
  $("save").disabled=false;
  onSnapshot(doc(db,"perfiles",uid),s=>{
    const d=s.exists()?s.data():null;
    mine=d?{name:String(d.name||"").slice(0,30),photo:String(d.photo||""),approved:d.approved===true}:null;
    renderMine();
  },()=>msg("No pude leer tu perfil.",true));
  onSnapshot(query(collection(db,"perfiles"),where("approved","==",true),limit(300)),s=>{
    all=s.docs.map(d=>({id:d.id,name:String(d.data().name||"").slice(0,30),photo:String(d.data().photo||"")}));
    renderList();
  },()=>msg("No pude cargar los perfiles.",true));
}
onAuthStateChanged(auth,u=>{
  if(!u){signInAnonymously(auth).catch(()=>msg("No pude entrar. Revisa tu internet y recarga.",true));return}
  uid=u.uid; start();
});
renderList();
</script>
</body>
</html>
